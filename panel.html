<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot WA Monitor — Liquid Glass</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.22);
    --glass-highlight: rgba(255, 255, 255, 0.35);
    --text-main: #f4f7fb;
    --text-muted: #b8c4d9;
    --accent-cyan: #38bdf8;
    --accent-emerald: #34d399;
    --accent-rose: #fb7185;
    --accent-amber: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  body {
    min-height: 100vh;
    color: var(--text-main);
    background: radial-gradient(circle at 15% 15%, #1e3a8a 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, #0f766e 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, #4c1d95 0%, transparent 50%),
                #060913;
    background-attachment: fixed;
    padding: 16px;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.45;
    z-index: -1;
    animation: floatBlob 12s infinite alternate ease-in-out;
  }
  .blob-1 { width: 260px; height: 260px; background: #0284c7; top: -40px; left: -40px; }
  .blob-2 { width: 300px; height: 300px; background: #10b981; bottom: 10%; right: -60px; animation-delay: 3s; }

  @keyframes floatBlob {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(25px, 35px) scale(1.1); }
  }

  .container { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), inset 0 1px 1px var(--glass-highlight);
    border-radius: 22px;
    padding: 18px;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.3px; }
  .brand p { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

  .status-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .badge {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
  .dot.offline { background: var(--accent-rose); box-shadow: 0 0 8px var(--accent-rose); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; }

  button {
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: rgba(255, 255, 255, 0.12);
    color: var(--text-main);
    padding: 9px 15px;
    border-radius: 14px;
    font-size: 0.84rem;
    font-weight: 600;
    backdrop-filter: blur(10px);
    transition: all 0.2s ease;
  }
  button:hover { background: rgba(255, 255, 255, 0.22); transform: translateY(-1px); }
  button:active { transform: scale(0.98); }

  .btn-primary { background: rgba(56, 189, 248, 0.25); border-color: rgba(56, 189, 248, 0.5); }
  .btn-success { background: rgba(52, 211, 153, 0.25); border-color: rgba(52, 211, 153, 0.5); }
  .btn-danger { background: rgba(251, 113, 133, 0.25); border-color: rgba(251, 113, 133, 0.5); }
  .btn-amber { background: rgba(251, 191, 36, 0.25); border-color: rgba(251, 191, 36, 0.5); }

  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .tab-btn { flex: 1; min-width: 110px; text-align: center; }
  .tab-btn.active {
    background: rgba(255, 255, 255, 0.26);
    border-color: rgba(255, 255, 255, 0.55);
    box-shadow: 0 4px 15px rgba(56, 189, 248, 0.25);
  }

  .panel-section { display: none; }
  .panel-section.active { display: block; }

  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  input.glass-input, select.glass-input {
    flex: 1;
    min-width: 160px;
    background: rgba(5, 8, 15, 0.55);
    color: var(--text-main);
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 0.84rem;
    outline: none;
  }

  textarea.code-editor {
    width: 100%;
    height: 410px;
    background: rgba(5, 8, 15, 0.88);
    color: #e2e8f0;
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 16px;
    padding: 14px;
    font-family: "JetBrains Mono", "Fira Code", monospace;
    font-size: 0.8rem;
    line-height: 1.45;
    resize: vertical;
    outline: none;
  }

  .list-stack { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }

  .item-card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chat-card {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 12px 14px;
  }
  .chat-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; gap: 8px; flex-wrap: wrap; }
  .chat-user { font-weight: 600; color: var(--accent-cyan); }
  .chat-msg { font-size: 0.86rem; background: rgba(0,0,0,0.28); padding: 8px 10px; border-radius: 10px; margin-bottom: 6px; white-space: pre-wrap; word-break: break-word; }
  .chat-reply { font-size: 0.82rem; color: #a7f3d0; padding-left: 8px; border-left: 2px solid var(--accent-emerald); }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid var(--accent-cyan);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 0.84rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
  <header class="glass">
    <div class="brand">
      <h1>Liquid Glass Bot Monitor</h1>
      <p id="wibClock">Memuat waktu WIB...</p>
    </div>
    <div class="status-row">
      <span class="badge"><span id="connDot" class="dot"></span><span id="connText">Online</span></span>
      <span class="badge" id="modeBadge">🔒 Admin Only</span>
      <span class="badge" id="schedBadge">📅 0 Jadwal</span>
    </div>
  </header>

  <section class="glass controls">
    <button class="btn-primary" onclick="toggleMode()">🔄 Ganti Mode (Admin / Public)</button>
    <button class="btn-amber" onclick="restartBot()">⚡ Restart Bot</button>
    <button class="btn-danger" onclick="stopBot()">🛑 Matikan Bot</button>
    <button onclick="refreshAll()">🔃 Refresh Data</button>
  </section>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('chats', this)">💬 Riwayat Chat</button>
    <button class="tab-btn" onclick="switchTab('users', this)">👥 List Terdaftar (.add)</button>
    <button class="tab-btn" onclick="switchTab('editor', this)">📝 Edit index.js</button>
  </nav>

  <!-- TAB 1: RIWAYAT PERCAKAPAN DENGAN FILTER NOMOR & PENCARIAN -->
  <section id="tab-chats" class="glass panel-section active">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <strong style="font-size:0.9rem;">Riwayat Percakapan Bot (<span id="chatCount">0</span>)</strong>
      <button class="btn-danger" onclick="clearChats()" style="padding:5px 10px; font-size:0.76rem;">Hapus Semua Riwayat</button>
    </div>
    <div class="filter-bar">
      <select id="numberFilter" class="glass-input" onchange="renderFilteredChats()">
        <option value="">Semua Nomor / Pengirim</option>
      </select>
      <input type="text" id="searchInput" class="glass-input" placeholder="Cari isi pesan, perintah, atau nama..." oninput="renderFilteredChats()">
    </div>
    <div id="chatList" class="list-stack"></div>
  </section>

  <!-- TAB 2: LIST PENGGUNA & ADMIN MANUAL (.add) -->
  <section id="tab-users" class="glass panel-section">
    <div style="margin-bottom:10px;">
      <strong style="font-size:0.9rem;">Daftar Admin & Pengguna (.add)</strong>
      <p style="font-size:0.78rem; color:var(--text-muted); margin-top:2px;">Dikelola manual dari WhatsApp lewat perintah <code>.add 0812xxx</code>, <code>.add admin 0812xxx</code>, atau <code>.del 0812xxx</code>.</p>
    </div>
    <div id="userList" class="list-stack"></div>
  </section>

  <!-- TAB 3: EDITOR KODE INDEX.JS -->
  <section id="tab-editor" class="glass panel-section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
      <strong style="font-size:0.9rem;">Editor Langsung: index.js</strong>
      <div style="display:flex; gap:8px;">
        <button onclick="loadCode()" style="padding:6px 12px; font-size:0.78rem;">Muat Ulang File</button>
        <button class="btn-success" onclick="saveCode()" style="padding:6px 14px; font-size:0.78rem;">💾 Simpan & Terapkan</button>
      </div>
    </div>
    <textarea id="codeEditor" class="code-editor" spellcheck="false"></textarea>
  </section>
</div>

<div id="toast" class="toast">Tersimpan!</div>

<script>
  let cachedChats = [];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.panel-section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'editor' && !document.getElementById('codeEditor').value) loadCode();
  }

  const evtSource = new EventSource('/api/stream');
  evtSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    if (data.type === 'chat' || data.type === 'user') {
      refreshAll();
    }
  };

  function updateNumberDropdown(chats) {
    const select = document.getElementById('numberFilter');
    const currentVal = select.value;
    const uniqueMap = new Map();

    chats.forEach(c => {
      if (c.number && !uniqueMap.has(c.number)) {
        uniqueMap.set(c.number, c.name || 'Pengguna WA');
      }
    });

    let optionsHtml = '<option value="">Semua Nomor / Pengirim</option>';
    for (const [num, name] of uniqueMap.entries()) {
      optionsHtml += `<option value="${escapeHtml(num)}">+${escapeHtml(num)} (${escapeHtml(name)})</option>`;
    }
    select.innerHTML = optionsHtml;
    if (uniqueMap.has(currentVal)) select.value = currentVal;
  }

  function renderFilteredChats() {
    const selectedNum = document.getElementById('numberFilter').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = cachedChats.filter(c => {
      const matchNum = !selectedNum || c.number === selectedNum;
      const matchKey = !keyword ||
        (c.number && c.number.includes(keyword)) ||
        (c.name && c.name.toLowerCase().includes(keyword)) ||
        (c.incoming && c.incoming.toLowerCase().includes(keyword)) ||
        (c.reply && c.reply.toLowerCase().includes(keyword));
      return matchNum && matchKey;
    });

    document.getElementById('chatCount').textContent = filtered.length;
    const chatList = document.getElementById('chatList');

    if (filtered.length === 0) {
      chatList.innerHTML = '<p style="color:var(--text-muted); font-size:0.84rem;">Tidak ada riwayat percakapan yang cocok.</p>';
      return;
    }

    chatList.innerHTML = filtered.slice().reverse().map(c => `
      <div class="chat-card">
        <div class="chat-meta">
          <span class="chat-user">${escapeHtml(c.name || 'Pengguna WA')} (+${escapeHtml(c.number)}) • ${escapeHtml(c.context)}</span>
          <span>${escapeHtml(c.time)}</span>
        </div>
        <div class="chat-msg">${escapeHtml(c.incoming)}</div>
        <div class="chat-reply">Bot: ${escapeHtml(c.reply)}</div>
      </div>
    `).join('');
  }

  async function refreshAll() {
    try {
      const res = await fetch('/api/state');
      const state = await res.json();

      document.getElementById('wibClock').textContent = state.wibTime;
      document.getElementById('modeBadge').textContent = state.adminOnly ? '🔒 Admin Only' : '🌐 Public';
      document.getElementById('schedBadge').textContent = `📅 ${state.activeSchedules} Jadwal`;

      const dot = document.getElementById('connDot');
      const cText = document.getElementById('connText');
      if (state.connected) {
        dot.classList.remove('offline');
        cText.textContent = 'Terhubung WA';
      } else {
        dot.classList.add('offline');
        cText.textContent = 'Terputus';
      }

      cachedChats = state.chats || [];
      updateNumberDropdown(cachedChats);
      renderFilteredChats();

      // Render List Admin & Pengguna (.add)
      const userList = document.getElementById('userList');
      const combined = [];
      (state.owners || []).forEach(num => combined.push({ number: num, role: 'Admin / Owner' }));
      (state.allowedUsers || []).forEach(num => {
        if (!(state.owners || []).includes(num)) {
          combined.push({ number: num, role: 'Pengguna Terdaftar (.add)' });
        }
      });

      if (combined.length === 0) {
        userList.innerHTML = '<p style="color:var(--text-muted); font-size:0.84rem;">Belum ada nomor yang ditambahkan lewat .add</p>';
      } else {
        userList.innerHTML = combined.map(u => `
          <div class="item-card">
            <div>
              <div style="font-weight:600; font-size:0.9rem; color:var(--accent-cyan);">+${escapeHtml(u.number)}</div>
              <div style="font-size:0.76rem; color:var(--text-muted); margin-top:2px;">${escapeHtml(u.role)}</div>
            </div>
            <span class="badge" style="color:${u.role.includes('Admin') ? 'var(--accent-amber)' : 'var(--accent-emerald)'};">
              ${u.role.includes('Admin') ? '👑 Admin' : '✅ Aktif'}
            </span>
          </div>
        `).join('');
      }
    } catch (e) {}
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  async function toggleMode() {
    await fetch('/api/toggle-mode', { method: 'POST' });
    showToast('Mode akses bot berhasil diubah!');
    refreshAll();
  }

  async function clearChats() {
    await fetch('/api/clear-chats', { method: 'POST' });
    showToast('Riwayat percakapan dibersihkan.');
    refreshAll();
  }

  async function loadCode() {
    const res = await fetch('/api/code');
    const data = await res.json();
    document.getElementById('codeEditor').value = data.code || '';
    showToast('Kode index.js dimuat.');
  }

  async function saveCode() {
    const code = document.getElementById('codeEditor').value;
    if (!code.trim()) return showToast('Kode tidak boleh kosong!');
    const res = await fetch('/api/code', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    if (res.ok) {
      showToast('Kode disimpan! Klik Restart Bot untuk menerapkan.');
    }
  }

  async function restartBot() {
    showToast('Merestart proses bot...');
    await fetch('/api/restart', { method: 'POST' });
  }

  async function stopBot() {
    showToast('Mematikan bot...');
    await fetch('/api/stop', { method: 'POST' });
  }

  setInterval(() => {
    fetch('/api/state').then(r => r.json()).then(s => {
      document.getElementById('wibClock').textContent = s.wibTime;
    }).catch(() => {});
  }, 1000);

  refreshAll();
</script>
</body>
</html>
